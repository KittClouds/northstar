[package]
name = "northstar-index-fund"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "northstar_index_fund"
path = "src/lib.rs"

[[bin]]
name = "northstar-index-fund"
path = "src/main.rs"
required-features = ["desktop", "fixtures"]

[[bin]]
name = "northstar-operating"
path = "src/operating_main.rs"
required-features = ["desktop"]

[[bin]]
name = "northstar-operating-replay"
path = "src/operating_replay_main.rs"
required-features = ["desktop", "fixtures"]

[features]
default = ["desktop", "fixtures"]
desktop = [
    "dep:anyhow",
    "dep:async-channel",
    "dep:gpui",
    "dep:gpui-component",
    "dep:gpui-animated-gradient-text",
    "dep:pulp",
]
fixtures = ["desktop"]

[dependencies]
anyhow = { version = "1.0", optional = true }
arc-swap = "1.9.2"
async-channel = { version = "=2.5.0", optional = true }
blake3 = "1.8"
bytemuck = { version = "1.21", features = ["derive"] }
crc32fast = "1.4"
crossbeam-channel = "0.5.16"
gpui = { version = "=0.2.2", optional = true }
gpui-component = { version = "=0.5.1", optional = true }
gpui-animated-gradient-text = { path = "../phoenix-native/crates/gpui-animated-gradient-text", optional = true }
hashbrown = "0.15"
memchr = "2.7"
memmap2 = "0.9"
pulp = { version = "0.22", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = { version = "1.15", features = ["serde"] }
thiserror = "2.0"
ureq = { version = "3.3", features = ["json"] }
zeroize = "1.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[dev-dependencies]
tempfile = "3.20"

[profile.dev.package]
gpui = { opt-level = 3 }
gpui-macros = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-component-macros = { opt-level = 3 }
taffy = { opt-level = 3 }
cosmic-text = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
pulp = { opt-level = 3 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
